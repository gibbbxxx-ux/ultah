<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selamat Ulang Tahun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF4F8;
    --pink:#FFD3E3;
    --rose:#FF8CB5;
    --berry:#C93D7C;
    --lavender:#E4D8FF;
    --butter:#FFF1B0;
    --mint:#CDF4E6;
    --ink:#5B3052;
    --paper:#FFFFFF;
    --display:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
    --body:"Quicksand","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:var(--body);
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, var(--pink) 0 90px, transparent 91px),
      radial-gradient(circle at 92% 22%, var(--lavender) 0 70px, transparent 71px),
      radial-gradient(circle at 6% 62%, var(--butter) 0 60px, transparent 61px),
      radial-gradient(circle at 95% 78%, var(--mint) 0 80px, transparent 81px),
      var(--bg);
    background-attachment:fixed;
    line-height:1.65;
    font-size:1.05rem;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
  :focus-visible{outline:3px dashed var(--berry);outline-offset:4px}

  /* ---------- hero ---------- */
  .hero{
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:3rem 1.25rem 2rem;
    position:relative;
  }
  .bunting{
    position:absolute;top:0;left:0;width:100%;height:70px;
    pointer-events:none;
  }
  .age-badge{
    display:inline-flex;align-items:center;gap:.4rem;
    background:var(--butter);color:var(--berry);
    font-family:var(--display);font-weight:600;
    padding:.35rem 1.1rem;border-radius:999px;
    border:3px solid var(--ink);
    transform:rotate(-3deg);
    box-shadow:4px 4px 0 var(--ink);
    margin-bottom:1.2rem;
  }
  .hero h1{
    font-size:clamp(2.3rem,8vw,4.6rem);
    color:var(--berry);
    text-shadow:3px 3px 0 var(--pink);
    max-width:14ch;
    margin-inline:auto;
  }
  .hero .sub{max-width:34ch;margin:1rem auto 0;font-weight:500}

  .cake-wrap{margin-top:2rem;position:relative}
  .cake{width:min(300px,78vw);height:auto;display:block;margin:auto;overflow:visible}
  .flame{
    transform-box:fill-box;transform-origin:50% 100%;
    animation:flicker 1.1s ease-in-out infinite alternate;
    transition:opacity .35s, transform .35s;
    cursor:pointer;
  }
  .flame:nth-of-type(2){animation-delay:.25s}
  .flame:nth-of-type(3){animation-delay:.5s}
  @keyframes flicker{
    from{transform:scale(1,1) rotate(-3deg)}
    to{transform:scale(.88,1.12) rotate(3deg)}
  }
  .blown .flame{opacity:0;transform:scale(.2);animation:none}
  .smoke{opacity:0;transition:opacity .4s}
  .blown .smoke{opacity:.8;animation:rise 1.6s ease-out forwards}
  @keyframes rise{from{transform:translateY(0);opacity:.8}to{transform:translateY(-26px);opacity:0}}

  .btn{
    font-family:var(--display);font-weight:600;font-size:1.1rem;
    color:#fff;background:var(--rose);
    border:3px solid var(--ink);border-radius:999px;
    padding:.7rem 1.8rem;margin-top:1.6rem;cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .wish-msg{
    min-height:2.2em;margin-top:1rem;font-family:var(--display);
    font-size:1.2rem;color:var(--berry);
  }

  /* ---------- sections ---------- */
  section.block{max-width:1000px;margin:0 auto;padding:4rem 1.25rem}
  .block > h2{
    font-size:clamp(1.7rem,5vw,2.5rem);text-align:center;color:var(--berry);
    margin-bottom:.4rem;
  }
  .block > .lead{text-align:center;margin:0 auto 2.5rem;max-width:44ch}

  /* ---------- photos ---------- */
  .gallery{
    display:grid;gap:2rem 1.5rem;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    padding:.5rem;
  }
  .polaroid{
    margin:0;background:var(--paper);
    padding:.8rem .8rem 1rem;
    border-radius:6px;
    box-shadow:0 6px 0 rgba(91,48,82,.12), 0 14px 24px rgba(201,61,124,.15);
    position:relative;
    transition:transform .2s;
  }
  .polaroid:nth-child(odd){transform:rotate(-2.5deg)}
  .polaroid:nth-child(even){transform:rotate(2deg)}
  .polaroid:nth-child(3n){transform:rotate(-1deg)}
  .polaroid:hover{transform:rotate(0) scale(1.03);z-index:2}
  .polaroid::before{ /* washi tape */
    content:"";position:absolute;top:-12px;left:50%;
    width:84px;height:24px;transform:translateX(-50%) rotate(-4deg);
    background:repeating-linear-gradient(45deg,var(--butter) 0 8px,#FFE88A 8px 16px);
    opacity:.9;border-radius:3px;
  }
  .polaroid:nth-child(even)::before{
    background:repeating-linear-gradient(45deg,var(--mint) 0 8px,#B5EBD8 8px 16px);
  }
  .polaroid:nth-child(3n)::before{
    background:repeating-linear-gradient(45deg,var(--lavender) 0 8px,#D2C2FF 8px 16px);
  }
  .photo-slot{
    display:block;position:relative;cursor:default;
    aspect-ratio:1/1;border-radius:4px;overflow:hidden;
    background:var(--pink);
  }
  .photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .photo-slot:not(.has-photo){cursor:pointer}
  .photo-slot img{pointer-events:none;-webkit-user-drag:none;user-select:none}
  .photo-slot:focus-within{outline:3px dashed var(--berry);outline-offset:3px}
  .placeholder{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
    border:3px dashed var(--rose);border-radius:4px;
    color:var(--berry);font-family:var(--display);font-size:.95rem;
    background:
      radial-gradient(circle at 20% 25%, #fff8 0 14px, transparent 15px),
      radial-gradient(circle at 80% 75%, #fff8 0 18px, transparent 19px),
      var(--pink);
  }
  .placeholder svg{width:46px;height:46px}
  .has-photo .placeholder{display:none}
  .polaroid figcaption{
    font-family:var(--display);text-align:center;margin-top:.75rem;
    font-size:1.05rem;color:var(--ink);
  }

  /* ---------- letter ---------- */
  .letter{
    max-width:640px;margin:0 auto;
    background:var(--paper);
    border:3px solid var(--ink);border-radius:22px;
    padding:2rem 1.6rem 2.2rem;
    box-shadow:8px 8px 0 var(--lavender), 8px 8px 0 3px var(--ink);
    position:relative;
  }
  .letter h2{color:var(--berry);font-size:1.7rem;margin-bottom:1rem}
  .letter p{margin:0 0 1rem}
  .letter .sign{font-family:var(--display);color:var(--berry);font-size:1.2rem;margin-top:1.5rem;text-align:right}

  /* ---------- wishes ---------- */
  .wishes{
    display:grid;gap:1.2rem;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  }
  .wish{
    border-radius:26px;padding:1.4rem 1.2rem;text-align:center;
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 var(--ink);
  }
  .wish:nth-child(1){background:var(--mint)}
  .wish:nth-child(2){background:var(--butter)}
  .wish:nth-child(3){background:var(--lavender)}
  .wish .emoji{font-size:2.2rem;display:block;margin-bottom:.4rem}
  .wish h3{font-size:1.2rem;margin-bottom:.35rem}
  .wish p{margin:0;font-size:.98rem}

  footer{text-align:center;padding:3rem 1rem 4rem;font-family:var(--display);color:var(--berry)}

  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .flame{animation:none}
    .polaroid{transition:none}
  }
</style>
</head>
<body>

<!-- =============== HERO =============== -->
<header class="hero" id="hero">
  <svg class="bunting" viewBox="0 0 800 70" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 8 Q 200 60 400 8 T 800 8" fill="none" stroke="#5B3052" stroke-width="3"/>
    <g stroke="#5B3052" stroke-width="2.5" stroke-linejoin="round">
      <path d="M60 30 l22 0 -11 30z" fill="#FF8CB5"/>
      <path d="M140 42 l22 0 -11 30z" fill="#FFF1B0"/>
      <path d="M220 50 l22 0 -11 30z" fill="#CDF4E6"/>
      <path d="M300 52 l22 0 -11 30z" fill="#E4D8FF"/>
      <path d="M380 50 l22 0 -11 30z" fill="#FF8CB5"/>
      <path d="M460 52 l22 0 -11 30z" fill="#FFF1B0"/>
      <path d="M540 50 l22 0 -11 30z" fill="#CDF4E6"/>
      <path d="M620 42 l22 0 -11 30z" fill="#E4D8FF"/>
      <path d="M700 30 l22 0 -11 30z" fill="#FF8CB5"/>
    </g>
  </svg>

  <div class="age-badge"><span aria-hidden="true">🎀</span> <span id="umur-teks"></span></div>
  <h1 id="judul"></h1>
  <p class="sub" id="subjudul"></p>

  <div class="cake-wrap" id="cake-wrap">
    <svg class="cake" viewBox="0 0 300 280" role="img" aria-label="Kue ulang tahun dengan tiga lilin">
      <!-- plate -->
      <ellipse cx="150" cy="258" rx="140" ry="16" fill="#E4D8FF" stroke="#5B3052" stroke-width="3"/>
      <!-- bottom layer -->
      <path d="M40 160 h220 v78 a20 20 0 0 1 -20 20 h-180 a20 20 0 0 1 -20 -20z" fill="#FFD3E3" stroke="#5B3052" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40 160 h220 v18 q-18 14 -36 0 q-18 14 -36 0 q-18 14 -36 0 q-18 14 -36 0 q-18 14 -36 0 q-18 14 -36 0z" fill="#fff" stroke="#5B3052" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#FF8CB5"><circle cx="80" cy="212" r="6"/><circle cx="150" cy="224" r="6"/><circle cx="220" cy="212" r="6"/><circle cx="115" cy="238" r="5"/><circle cx="185" cy="238" r="5"/></g>
      <!-- top layer -->
      <path d="M80 100 h140 v62 h-140z" fill="#E4D8FF" stroke="#5B3052" stroke-width="3" stroke-linejoin="round"/>
      <path d="M80 100 h140 v16 q-17.5 14 -35 0 q-17.5 14 -35 0 q-17.5 14 -35 0 q-17.5 14 -35 0z" fill="#fff" stroke="#5B3052" stroke-width="3" stroke-linejoin="round"/>
      <!-- cherries -->
      <circle cx="110" cy="96" r="9" fill="#FF5C93" stroke="#5B3052" stroke-width="3"/>
      <circle cx="190" cy="96" r="9" fill="#FF5C93" stroke="#5B3052" stroke-width="3"/>
      <!-- face -->
      <g fill="#5B3052"><circle cx="128" cy="138" r="4"/><circle cx="172" cy="138" r="4"/></g>
      <path d="M142 144 q8 8 16 0" fill="none" stroke="#5B3052" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="116" cy="148" rx="7" ry="4.5" fill="#FF8CB5" opacity=".7"/>
      <ellipse cx="184" cy="148" rx="7" ry="4.5" fill="#FF8CB5" opacity=".7"/>
      <!-- candles -->
      <g stroke="#5B3052" stroke-width="3" stroke-linejoin="round">
        <rect x="112" y="54" width="14" height="46" rx="3" fill="#FFF1B0"/>
        <rect x="143" y="48" width="14" height="52" rx="3" fill="#CDF4E6"/>
        <rect x="174" y="54" width="14" height="46" rx="3" fill="#FFD3E3"/>
      </g>
      <g stroke="#5B3052" stroke-width="2"><path d="M112 66l14 -8M112 80l14 -8M143 60l14 -8M143 74l14 -8M174 66l14 -8M174 80l14 -8" opacity=".35"/></g>
      <!-- flames -->
      <path class="flame" d="M119 52 c-9 -10 -2 -20 0 -28 c2 8 11 18 0 28z" fill="#FFB347" stroke="#5B3052" stroke-width="2.5" stroke-linejoin="round" data-blow/>
      <path class="flame" d="M150 46 c-9 -10 -2 -20 0 -28 c2 8 11 18 0 28z" fill="#FFB347" stroke="#5B3052" stroke-width="2.5" stroke-linejoin="round" data-blow/>
      <path class="flame" d="M181 52 c-9 -10 -2 -20 0 -28 c2 8 11 18 0 28z" fill="#FFB347" stroke="#5B3052" stroke-width="2.5" stroke-linejoin="round" data-blow/>
      <!-- smoke -->
      <g class="smoke" fill="none" stroke="#9a86a6" stroke-width="3" stroke-linecap="round">
        <path d="M119 40 q-6 -8 0 -14"/><path d="M150 34 q-6 -8 0 -14"/><path d="M181 40 q-6 -8 0 -14"/>
      </g>
    </svg>
  </div>

  <button class="btn" id="tiup" type="button">Tiup lilinnya</button>
  <div class="wish-msg" id="wish-msg" aria-live="polite"></div>
</header>

<!-- =============== FOTO =============== -->
<section class="block" id="foto">
  <h2>Momen-momen manis</h2>
  <p class="lead" id="lead-foto"></p>
  <div class="gallery" id="gallery"></div>
</section>

<!-- =============== SURAT =============== -->
<section class="block" id="surat">
  <article class="letter">
    <h2 id="surat-judul"></h2>
    <div id="surat-isi"></div>
    <div class="sign" id="surat-ttd"></div>
  </article>
</section>

<!-- =============== HARAPAN =============== -->
<section class="block" id="harapan">
  <h2>Harapan untukmu</h2>
  <p class="lead">Semoga tahun ini isinya hal-hal baik saja.</p>
  <div class="wishes" id="wishes"></div>
</section>

<footer id="footer"></footer>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ==========================================================
   EDIT BAGIAN INI SAJA 
   ========================================================== */
const CONFIG = {
  nama: "Kakakkkkkk",          // nama yang berulang tahun
  umur: 19,                // umur barunya
  pengirim: "CEO embege",         // nama kamu

  subjudul: "Hari ini adalah harimu. Tiup lilinnya dan buat satu permintaan!",
  leadFoto: "ㅤ",

  /* FOTO
     Cara tetap (permanen): taruh file foto di folder yang sama dengan file ini,
     lalu isi "src", contoh: src: "foto1.jpg"
     Cara cepat (hanya preview, hilang kalau di-refresh): klik kotak fotonya di halaman. */
  foto: [
    { src: "foto1.jpeg", caption: "ㅤ" },
    { src: "foto2.jpeg", caption: "" },
    { src: "foto3.jpeg", caption: "" },
    { src: "foto4.jpeg", caption: "ㅤ" },
    { src: "foto5.jpeg", caption: "" },
    { src: "foto6.jpeg", caption: "" }
  ],

  suratJudul: "Surat kecil untukmu",
  surat: [
    "Selamat ulang tahun my kakak gweh! Terima kasih sudah jadi orang yang bikin hari-hariku lebih berwarna.",
    "Aku harap kamu selalu sehat, bahagia, dan dikelilingi orang-orang yang sayang sama kamu. Semoga semua hal yang kamu impikan satu per satu jadi nyata.",
    "Aku harap kamu bisa menjalani hari hari dengan lancar, dan kamu bisa menjadi kakak dan adek yang baik  buat sodara sodara kamu."
  ],

  harapan: [
    { emoji: "🌸", judul: "Sehat selalu",   isi: "Badan kuat, hati tenang, tidur nyenyak." },
    { emoji: "🍰", judul: "Banyak bahagia", isi: "Tiap hari ada alasan kecil buat tertawa." },
    { emoji: "✨", judul: "Mimpi terwujud", isi: "Pelan-pelan, satu demi satu, semuanya sampai." }
  ]
};
/* ========================================================= */

const $ = (s) => document.querySelector(s);

/* ---- isi teks ---- */
document.title = `Selamat ulang tahun, ${CONFIG.nama}!`;
$("#umur-teks").textContent = `Usia ke-${CONFIG.umur}`;
$("#judul").textContent = `Selamat ulang tahun, ${CONFIG.nama}!`;
$("#subjudul").textContent = CONFIG.subjudul;
$("#lead-foto").textContent = CONFIG.leadFoto;
$("#surat-judul").textContent = CONFIG.suratJudul;
$("#surat-ttd").textContent = `${CONFIG.pengirim} 💗`;
$("#footer").textContent = `Dibuat dengan cinta untuk ${CONFIG.nama} 🎂`;

$("#surat-isi").innerHTML = CONFIG.surat.map(p => `<p></p>`).join("");
[...document.querySelectorAll("#surat-isi p")].forEach((el, i) => el.textContent = CONFIG.surat[i]);

/* ---- harapan ---- */
$("#wishes").innerHTML = CONFIG.harapan.map(() => `
  <div class="wish"><span class="emoji"></span><h3></h3><p></p></div>`).join("");
[...document.querySelectorAll(".wish")].forEach((el, i) => {
  const h = CONFIG.harapan[i];
  el.querySelector(".emoji").textContent = h.emoji;
  el.querySelector("h3").textContent = h.judul;
  el.querySelector("p").textContent = h.isi;
});

/* ---- galeri foto ---- */
const cameraIcon = `
<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M6 16a4 4 0 0 1 4-4h5l3-4h12l3 4h5a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/>
  <circle cx="24" cy="25" r="8"/>
</svg>`;

const gallery = $("#gallery");
CONFIG.foto.forEach((f, i) => {
  const fig = document.createElement("figure");
  fig.className = "polaroid";
  fig.innerHTML = `
    <label class="photo-slot${f.src ? " has-photo" : ""}">
      ${f.src ? `<img alt="">` : ""}
      <span class="placeholder">${cameraIcon}<span>Taruh fotomu di sini</span></span>
      ${f.src ? "" : `<input type="file" accept="image/*" aria-label="Pilih foto ${i + 1}">`}
    </label>
    <figcaption></figcaption>`;
  fig.querySelector("figcaption").textContent = f.caption;
  const img = fig.querySelector("img");
  if (img) { img.src = f.src; img.alt = f.caption; }

  const picker = fig.querySelector("input");
  if (picker) picker.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const slot = fig.querySelector(".photo-slot");
    let im = slot.querySelector("img");
    if (!im) { im = document.createElement("img"); slot.prepend(im); }
    im.alt = f.caption;
    im.src = URL.createObjectURL(file);
    slot.classList.add("has-photo");
  });
  gallery.appendChild(fig);
});

/* ---- confetti ---- */
const canvas = $("#confetti");
const ctx = canvas.getContext("2d");
let parts = [], running = false;
const colors = ["#FF8CB5", "#FFF1B0", "#CDF4E6", "#E4D8FF", "#FF5C93", "#FFB347"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize); resize();

function burst(){
  const n = reduce ? 30 : 140;
  for (let i = 0; i < n; i++){
    parts.push({
      x: innerWidth / 2, y: innerHeight * 0.4,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
      s: 6 + Math.random() * 7, r: Math.random() * 6,
      vr: (Math.random() - .5) * .3,
      c: colors[(Math.random() * colors.length) | 0],
      heart: Math.random() < .3, life: 0
    });
  }
  if (!running){ running = true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  parts.forEach(p => {
    p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.heart){ ctx.font = p.s * 2 + "px serif"; ctx.fillText("♥", -p.s, p.s); }
    else ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
    ctx.restore();
  });
  parts = parts.filter(p => p.y < canvas.height + 30);
  if (parts.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
}

/* ---- tiup lilin ---- */
const wrap = $("#cake-wrap"), btn = $("#tiup"), msg = $("#wish-msg");
function blow(){
  if (wrap.classList.contains("blown")){   // nyalakan lagi
    wrap.classList.remove("blown");
    btn.textContent = "Tiup lilinnya";
    msg.textContent = "";
    return;
  }
  wrap.classList.add("blown");
  btn.textContent = "Nyalakan lagi";
  msg.textContent = "Yeay! Semoga permintaanmu terkabul 💖";
  burst();
  setTimeout(() => $("#foto").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }), 2600);
}
btn.addEventListener("click", blow);
document.querySelectorAll("[data-blow]").forEach(f => f.addEventListener("click", blow));
</script>
</body>
</html>
